services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir streamlit requests && streamlit run ui/app.py --server.address 0.0.0.0"
    environment:
      API_URL: http://api:8000
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - api
